<style>

  font-family: 'Oswald', sans-serif;

  letter-spacing: 2px;

}
h2 { 
  font-family: 'Oswald', sans-serif; 
  font-size: 20px; 
  text-transform: uppercase; 
  background: var(--ac);
  color: #000;

  padding: 4px 10px;

}

.mut { color: var(--mut); margin: 4px 0; }
.small { font-size: 11px; font-family: 'Space Mono', monospace; }
.sub { font-family: 'Oswald', sans-serif; font-size: 14px; color: var(--ac); margin: 16px 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px dashed var(--bd); padding-bottom: 4px;}
.step { font-family: 'Oswald', sans-serif; font-size: 18px; color: var(--fg); margin: 20px 0 10px; text-transform: uppercase; background: var(--card); border: 2px solid var(--bd); padding: 4px 8px; display: inline-block;}

.card {
  background: var(--card);
  border: 3px solid var(--bd);
  border-radius: 0px;

label { display: block; font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 500; color: var(--fg); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px;}
input, select, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;

}
label.sw { white-space: normal; margin-top: 12px; font-weight: 500; }

button {
  font-family: 'Oswald', sans-serif;
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 12px 20px;
  border: 3px solid var(--bd);

summary::marker { color: var(--ac); }
details[open] summary { border-bottom: 2px solid var(--bd); margin-bottom: 10px; }

.pick {
  display: flex; gap: 16px; align-items: center; margin-top: 16px; padding: 16px;

}
.pick.ok { box-shadow: 6px 6px 0 var(--ok); }

.bar { display: grid; grid-template-columns: 70px 1fr 60px; gap: 8px; align-items: center; font-family: 'Space Mono', monospace; font-size: 12px; margin: 6px 0; font-weight: 700;}
.tr { height: 12px; background: #000; border: 2px solid var(--bd); overflow: hidden; }
.tr i { display: block; height: 100%; background: var(--ac); transition: width 0.5s ease; }
.bar b { text-align: right; color: var(--ac); }

table { width: 100%; border-collapse: collapse; font-family: 'Space Mono', monospace; font-size: 12px; margin-top: 12px; border: 2px solid var(--bd); }
td, th { padding: 8px 6px; border-bottom: 2px solid var(--bd); border-right: 2px solid var(--bd); text-align: left; }
th { background: var(--ac); color: #000; font-family: 'Oswald', sans-serif; font-size: 14px; }
tr:last-child td { border-bottom: none; }
td:last-child, th:last-child { border-right: none; }
td:nth-child(n+3), th:nth-child(n+3) { text-align: right; }
table.rt td:nth-child(2), table.rt th:nth-child(2) { text-align: right; }

.kv { display: flex; justify-content: space-between; padding: 8px; border: 2px solid var(--bd); margin-bottom: 4px; font-family: 'Space Mono', monospace; font-size: 12px; background: #000;}

[hidden] { display: none !important; }
body:not(.adv) .adv-only { display: none !important; }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
</style></head><body>

<h1>Parlay Quant</h1>

<label class="sw"><input type="checkbox" id="adv"> Mode Lanjutan (Tabel & λ)</label>

<div id="list"></div>
<button id="add">+ Tambah Laga</button>
<section class="card" id="pr"></section>

<details class="card"><summary>⚙️ Data Liga (CSV) & Pengaturan</summary>
<div id="set">
<div class="g2">
<label>Gol Kandang<input id="lh" type="number" step="0.01" inputmode="decimal" value="1.5"></label>
<label>Gol Tandang<input id="la" type="number" step="0.01" inputmode="decimal" value="1.2"></label>
<label>Rho (Dixon-Coles)<input id="rho" type="number" step="0.01" inputmode="decimal" value="-0.1"></label>
<label>Bankroll (Rp)<input id="bk" type="number" inputmode="decimal" value="1000000"></label>

</div></div>

<input id="csvn" placeholder="Nama liga">
<textarea id="csvt" rows="2" placeholder="Div,Date,HomeTeam,AwayTeam,FTHG,FTAG,..."></textarea><button id="csvb">Proses</button></details>
<div id="csvr" class="mut small"></div>
<button id="csvx" hidden>Hapus Data Liga</button></details>
</details>

<script>
const $=s=>document.querySelector(s);
const fact=[1];for(let i=1;i<=12;i++)fact[i]=fact[i-1]*i;
const pois=(k,l)=>Math.exp(-l)*Math.pow(l,k)/fact[k];
const pc=x=>(x*100).toFixed(1)+'%';
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fL=L=>L>0?'+'+L:''+L;
const PICKS={H:'Kandang',D:'Seri',A:'Tandang','1X':'1X (Kandang/Seri)',X2:'X2 (Seri/Tandang)',O05:'Over 0.5',U05:'Under 0.5',O15:'Over 1.5',U15:'Under 1.5',O25:'Over 2.5',U25:'Under 2.5',O35:'Over 3.5',U35:'Under 3.5',O45:'Over 4.5',U45:'Under 4.5',O55:'Over 5.5',U55:'Under 5.5',O65:'Over 6.5',U65:'Under 6.5',BY:'BTTS Ya',BN:'BTTS Tidak',AHH:'Asian Handicap Kandang',AHA:'Asian Handicap Tandang'};
const PG=[['Hasil Akhir',['H','D','A','1X','X2']],['Jumlah Gol',['O05','U05','O15','U15','O25','U25','O35','U35','O45','U45','O55','U55','O65','U65','BY','BN']],['Asian Handicap',['AHH','AHA']]];
const LINES=Array.from({length:41},(_,i)=>(i-20)/4);
const lineLbl=L=>fL(L)+(L==0?' (Seri)':'')+(L*4%2?` (${fL(L-0.25)} & ${fL(L+0.25)})`:'');
const plabel=(pk,ln)=>pk=='AHH'||pk=='AHA'?PICKS[pk]+' '+fL(+ln):PICKS[pk];

function matrix(lh,la,rho){
  const N=10,m=[];let sum=0;
  for(let i=0;i<=N;i++){m[i]=[];for(let j=0;j<=N;j++){
    let p=pois(i,lh)*pois(j,la);
    if(i==0&&j==0)p*=1-lh*la*rho;
    else if(i==0&&j==1)p*=1+lh*rho;
    else if(i==1&&j==0)p*=1+la*rho;
    else if(i==1&&j==1)p*=1-rho;
    m[i][j]=Math.max(p,0);sum+=m[i][j];}}
  return m.map(r=>r.map(p=>p/sum));
}
function model(lh,la,rho){
  const m=matrix(lh,la,rho),P={H:0,D:0,A:0,O05:0,O15:0,O25:0,O35:0,O45:0,O55:0,O65:0,BY:0},sc=[],dd={};
  m.forEach((r,i)=>r.forEach((p,j)=>{
    if(i>j)P.H+=p;else if(i==j)P.D+=p;else P.A+=p;
    const t=i+j;
    if(t>=1)P.O05+=p;if(t>=2)P.O15+=p;if(t>=3)P.O25+=p;if(t>=4)P.O35+=p;
    if(t>=5)P.O45+=p;if(t>=6)P.O55+=p;if(t>=7)P.O65+=p;
    if(i&&j)P.BY+=p;
    dd[i-j]=(dd[i-j]||0)+p;sc.push([i+'-'+j,p]);}));
  P['1X']=P.H+P.D;P.X2=P.D+P.A;
  P.U05=1-P.O05;P.U15=1-P.O15;P.U25=1-P.O25;P.U35=1-P.O35;
  P.U45=1-P.O45;P.U55=1-P.O55;P.U65=1-P.O65;
  P.BN=1-P.BY;
  const sum=f=>Object.keys(dd).reduce((a,d)=>f(+d)?a+dd[d]:a,0); 
  const comp=c=>({w:sum(d=>d+c>0),p:sum(d=>d+c==0),l:sum(d=>d+c<0)});
  const ah=LINES.map(L=>{const r=(L*4%2?[L-0.25,L+0.25]:[L]).map(comp),av=f=>r.reduce((a,x)=>a+x[f],0)/r.length;
    return{L,w:av('w'),p:av('p'),l:av('l')}});
  const fair=ah.reduce((b,x)=>Math.abs(x.w-x.l)<Math.abs(b.w-b.l)-1e-12?x:b);
  sc.sort((a,b)=>b[1]-a[1]);
  return{P,top:sc.slice(0,5),ah,fair};
}
function legOf(r,pk,ln){
  if(pk=='AHH'||pk=='AHA'){
    const L=+ln,x=r.ah.find(a=>Math.abs(a.L-(pk=='AHH'?L:-L))<1e-9);
    return pk=='AHH'?{w:x.w,u:x.p,l:x.l}:{w:x.l,u:x.p,l:x.w};
  }
  const w=r.P[pk];return{w,u:0,l:1-w};
}
const num=(c,k)=>parseFloat(c.querySelector('[data-k='+k+']').value);
const gv=(c,k)=>c.querySelector('[data-k='+k+']').value;

const CARD=`<div class="hd"><input class="nm" data-k="nm" placeholder="NAMA LAGA"><label class="inc"><input type="checkbox" data-k="inc" checked>Parlay</label><button class="x" title="Hapus" style="padding:8px; box-shadow:2px 2px 0 var(--bad);">✕</button></div>
<div class="lgw" hidden style="margin:8px 0"><label>Liga (CSV)<select class="lg"></select></label></div>
<div class="g2 ts" hidden>
<label>Tim Kandang<select class="th"></select></label>
<label>Tim Tandang<select class="ta"></select></label>
</div>
<div class="match-header">
  <div class="team-box">
    <img class="team-logo img-h" src="">
    <div class="team-name-lbl name-h"></div>
  </div>
  <div class="vs-badge">VS</div>
  <div class="team-box">
    <img class="team-logo img-a" src="">
    <div class="team-name-lbl name-a"></div>
  </div>
</div>
<p class="step">1. Statistik Gol</p>
<div class="g2">
<label>Kandang Cetak<input data-k="hs" type="number" step="0.01" inputmode="decimal" value="1.6"></label>
<label>Kandang Bobol<input data-k="hc" type="number" step="0.01" inputmode="decimal" value="1.0"></label>
<label>Tandang Cetak<input data-k="as" type="number" step="0.01" inputmode="decimal" value="1.2"></label>
<label>Tandang Bobol<input data-k="ac" type="number" step="0.01" inputmode="decimal" value="1.4"></label>
</div>
<details><summary>Home Adv. (%)</summary>
<label>Home Advantage (%)<input data-k="ha" type="number" step="1" inputmode="decimal" placeholder="ikut data liga"></label>
</details>
<details><summary>Data xG</summary>
<div class="g2">
<label>Kandang xG<input data-k="hx" type="number" step="0.01" inputmode="decimal"></label>
<label>Kandang xGA<input data-k="hxa" type="number" step="0.01" inputmode="decimal"></label>
<label>Tandang xG<input data-k="ax" type="number" step="0.01" inputmode="decimal"></label>
<label>Tandang xGA<input data-k="axa" type="number" step="0.01" inputmode="decimal"></label>
</div></details>

<details style="border: 2px solid var(--ac); padding: 8px; margin-top: 12px; background: #000;">
<summary style="margin-top:0; border:none; background: transparent; color: var(--ac); padding:0;">🧠 Smart Adjustments</summary>
<div class="g2" style="margin-bottom:0; margin-top: 10px;">
  <div>
    <label class="sw" style="margin-top:4px"><input type="checkbox" data-k="adj_ha"> Pemain Kunci H Absen</label>
    <label class="sw" style="margin-top:4px"><input type="checkbox" data-k="adj_hf"> Kandang Lelah</label>
    <label class="sw" style="margin-top:4px"><input type="checkbox" data-k="adj_hm"> Motivasi H Rendah</label>
  </div>
  <div>
    <label class="sw" style="margin-top:4px"><input type="checkbox" data-k="adj_aa"> Pemain Kunci A Absen</label>
    <label class="sw" style="margin-top:4px"><input type="checkbox" data-k="adj_af"> Tandang Lelah</label>
    <label class="sw" style="margin-top:4px"><input type="checkbox" data-k="adj_am"> Motivasi A Rendah</label>
  </div>
</div>
</details>

<p class="step">2. Taruhan & Odds</p>
<div class="g2">
<label>Pilih Taruhan<select data-k="pk"></select></label>
<label>Odds Bandar<input data-k="od" type="number" step="0.01" inputmode="decimal" placeholder="1.90"></label>
</div>
<div class="ahw" hidden>
<label>Handicap<select data-k="ln"></select></label>
</div>
<details class="adv-only"><summary>Opsi Lanjutan</summary>
<div class="g2"><label>λ Kandang<input data-k="mh" type="number" step="0.01" inputmode="decimal"></label><label>λ Tandang<input data-k="ma" type="number" step="0.01" inputmode="decimal"></label></div>
<div class="g3"><label>Odds 1<input data-k="o1" type="number" step="0.01" inputmode="decimal"></label><label>Odds X<input data-k="ox" type="number" step="0.01" inputmode="decimal"></label><label>Odds 2<input data-k="o2" type="number" step="0.01" inputmode="decimal"></label></div>
</details>
<div class="res"></div>`;

function calc(c){
  const L=LGS[c.querySelector('.lg').value];
  const LH=L?L.LH:+$('#lh').value,LA=L?L.LA:+$('#la').value;
  const rho=Math.max(-0.3,Math.min(0.3,(L?L.rho:+$('#rho').value)||0));
  let lh=num(c,'mh'),la=num(c,'ma');
  const hb=(LH/LA-1)*100,hg=gv(c,'ha')!==''?parseFloat(gv(c,'ha')):parseFloat($('#ha').value),hov=isFinite(hg)?Math.max(-50,Math.min(150,hg)):null,hr=hov==null?LH/LA:1+hov/100,LH2=hov==null?LH:(LH+LA)*hr/(1+hr),LA2=hov==null?LA:(LH+LA)/(1+hr);
  const W=Math.max(0,Math.min(1,(parseFloat($('#xw').value)||0)/100)),B=(g,x)=>{const a=num(c,g),b=num(c,x);return b>0?(a>=0?W*b+(1-W)*a:b):a}; 
  
  if(!(lh>0))lh=B('hs','hx')*B('ac','axa')/LH*(LH2/LH);
  if(!(la>0))la=B('as','ax')*B('hc','hxa')/LA*(LA2/LA);
  
  // --- SMART ADJUSTMENTS ---
  let lhAdj = 1, laAdj = 1;
  if(c.querySelector('[data-k=adj_ha]').checked) lhAdj *= 0.85;
  if(c.querySelector('[data-k=adj_hf]').checked) lhAdj *= 0.90;
  if(c.querySelector('[data-k=adj_hm]').checked) lhAdj *= 0.90;
  
  if(c.querySelector('[data-k=adj_aa]').checked) laAdj *= 0.85;
  if(c.querySelector('[data-k=adj_af]').checked) laAdj *= 0.90;
  if(c.querySelector('[data-k=adj_am]').checked) laAdj *= 0.90;
  
  lh *= lhAdj;
  la *= laAdj;

  if(!(lh>0&&la>0&&lh<8&&la<8))return null;
  return{lh,la,hov,hb,xw:W,xu:['hx','hxa','ax','axa'].some(k=>num(c,k)>0),...model(lh,la,rho)};
}
const bar=(l,p)=>`<div class="bar"><span>${l}</span><div class="tr"><i style="width:${p*100}%"></i></div><b>${pc(p)}</b></div>`;

function upd(c){
  const r=calc(c),out=c.querySelector('.res');c._r=r;
  const pk=gv(c,'pk'),isAH=pk=='AHH'||pk=='AHA';
  c.querySelector('.ahw').hidden=!isAH;
  if(!r){out.innerHTML='<p class="mut small">Isi data gol dengan valid.</p>';parlay();return}
  const{P,top,lh,la,ah,fair}=r,ln=gv(c,'ln'),od=num(c,'od'),lg=legOf(r,pk,ln),LG=LGS[c.querySelector('.lg').value];
  const idx=[...document.querySelectorAll('.m')].indexOf(c)+1;
  const fo=lg.w>1e-9?1+lg.l/lg.w:Infinity,fos=isFinite(fo)?fo.toFixed(2):'-';
  Object.assign(r,{name:gv(c,'nm').trim()||('Laga '+idx),label:plabel(pk,ln),w:lg.w,u:lg.u,l:lg.l,od:od>1?od:NaN,fo});
  let cls='neu',msg;
  if(od>1){
    const ev=lg.w*od+lg.u-1;cls=ev>0?'ok':'bad';
    msg=ev>0?`<b style="color:var(--ac)">VALUE!</b><br>Odds ${od.toFixed(2)} > ${fos}. Untung ${(ev*100).toFixed(1)}%.`
      :`<b style="color:var(--bad)">NO VALUE.</b><br>Odds ${od.toFixed(2)} < ${fos}. Rugi ${(-ev*100).toFixed(1)}%.`;
  }else msg=`Fair Odds: <b>${fos}</b>.<br>Isi odds bandar.`;
  const un=lg.u>0.005?` · Push ${pc(lg.u)}`:'';

  const adjActive = ['adj_ha','adj_hf','adj_hm','adj_aa','adj_af','adj_am'].some(k => c.querySelector(`[data-k=${k}]`).checked);
  if (adjActive) h += `<p class="sm ok" style="margin-top: 8px;">🧠 SMART ADJUSTMENT ACTIVE</p>`;

  h+='<p class="sub">Peluang</p>'+bar('KANDANG',P.H)+bar('SERI',P.D)+bar('TANDANG',P.A);
  h+=`<p class="sm" style="font-family:Space Mono; margin-top:12px;">O2.5: <b>${pc(P.O25)}</b> · U2.5: <b>${pc(P.U25)}</b> · BTTS: <b>${pc(P.BY)}</b></p>`;
  h+=`<p class="sm" style="font-family:Space Mono;">SKOR: <b>${top[0][0]}</b> (${pc(top[0][1])})</p>`;
  
  const trw=(l,a,b)=>`<tr><td>${l}</td><td>${pc(a)}</td><td>${pc(b)}</td></tr>`;
  let a=`<p class="mut small">λ: <b>${lh.toFixed(2)}</b> - <b>${la.toFixed(2)}</b></p>`;
  a+=`<table class="rt"><tr><th>Total</th><th>Over</th><th>Under</th></tr>
    ${trw('0.5',P.O05,P.U05)}${trw('1.5',P.O15,P.U15)}${trw('2.5',P.O25,P.U25)}
    ${trw('3.5',P.O35,P.U35)}${trw('4.5',P.O45,P.U45)}${trw('5.5',P.O55,P.U55)}${trw('6.5',P.O65,P.U65)}
    ${trw('BTTS',P.BY,P.BN)}</table>`;
  const fi=ah.indexOf(fair),rows=ah.slice(Math.max(0,fi-3),fi+4);
  a+=`<table class="rt"><tr><th>AH</th><th>M</th><th>P</th><th>K</th><th>Odds</th></tr>`+rows.map(x=>`<tr${x===fair?' style="font-weight:600;color:var(--ac)"':''}><td>${fL(x.L)}</td><td>${pc(x.w)}</td><td>${pc(x.p)}</td><td>${pc(x.l)}</td><td>${x.w>0?(1+x.l/x.w).toFixed(2):'-'}</td></tr>`).join('')+'</table>';
  out.innerHTML=h+`<div class="adv-only">${a}</div>`;parlay();
}

function parlay(){
  const pr=$('#pr'),L=[...document.querySelectorAll('.m')].filter(c=>c._r&&c._r.w!=null&&c.querySelector('[data-k=inc]').checked).map(c=>c._r);
  if(!L.length){pr.innerHTML='<h2>Parlay</h2><p class="mut small">Belum ada laga.</p>';return}
  let W=1,E=1,O=1,FO=1,all=true,push=false;
  L.forEach(r=>{W*=r.w;FO*=r.fo;if(r.u>0.005)push=true;if(r.od>1){O*=r.od;E*=r.w*r.od+r.u}else all=false});
  let h=`<h2>Parlay (${L.length} Laga)</h2><table><tr><th>Laga</th><th>Taruhan</th><th>Peluang</th><th>Odds</th></tr>`+
    L.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.label)}</td><td>${pc(r.w)}</td><td>${r.od>1?r.od.toFixed(2):'-'}</td></tr>`).join('')+'</table>';
  h+=`<div class="pick neu"><div class="big">${pc(W)}</div><div><b style="font-family:Oswald;">SEMUA MENANG</b><br>Fair Odds: ${isFinite(FO)?FO.toFixed(2):'-'}.</div></div>`;
  if(all){
    const ev=E-1;
    h+=`<div class="pick ${ev>0?'ok':'bad'}"><div class="big">${ev>0?'V':'X'}</div><div><b style="font-family:Oswald;">${ev>0?'VALUE':'NO VALUE'}</b><br>Odds Gabungan ${O.toFixed(2)}. ${ev>0?'Untung':'Rugi'} ${Math.abs(ev*100).toFixed(1)}%.</div></div>`;
    if(!push){const f=O>1?ev/(O-1):0,bk=+$('#bk').value||0,kf=+$('#kf').value||0.25;
      h+='<details><summary>Saran Taruhan</summary>'+(f>0?`<p class="sm">Maks <b>${(f*kf*100).toFixed(1)}%</b> bankroll (Rp ${Math.round(bk*f*kf).toLocaleString('id-ID')}) Kelly ×${kf}.</p>`:'<p class="sm">Tidak ada rekomendasi.</p>')+'</details>'}
  }else h+='<p class="mut small">Isi odds semua laga.</p>';
  pr.innerHTML=h;
}

function add(){
  const c=document.createElement('section');c.className='card m';c.innerHTML=CARD;$('#list').appendChild(c);
  c.querySelector('[data-k=pk]').innerHTML=PG.map(([g,ks])=>`<optgroup label="${g}">`+ks.map(k=>`<option value="${k}">${PICKS[k]}</option>`).join('')+'</optgroup>').join('');

}

async function getBadge(name, imgEl, nameEl, vsEl) {
    if (!name || name === '- pilih tim -') { 
        imgEl.style.display = 'none'; 
        nameEl.style.display = 'none';
        checkVS(imgEl.closest('.match-header'));
        return; 
    }
    
    imgEl.style.display = 'block';
    nameEl.style.display = 'block';
    nameEl.textContent = name;
    
    const initials = name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><rect width="128" height="128" fill="#09090b" stroke="#ccff00" stroke-width="8"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Space Mono, monospace" font-size="48" font-weight="bold" fill="#ccff00">${initials}</text></svg>`;
    const fallback = `data:image/svg+xml;base64,${btoa(svg)}`;

    let cache = JSON.parse(localStorage.getItem('badges_v2') || '{}');
    if (cache[name]) { 
        imgEl.src = cache[name]; 
        checkVS(imgEl.closest('.match-header'));
        return; 
    }

    imgEl.src = fallback;

    try {
        const searchName = TEAM_ALIASES[name] || name;
        const r = await fetch(`https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t=${encodeURIComponent(searchName)}`);
        if (!r.ok) throw new Error('API Limit');
        const data = await r.json();
        
        if (data.teams && data.teams[0] && data.teams[0].strTeamBadge) {
            imgEl.src = data.teams[0].strTeamBadge;
            cache[name] = data.teams[0].strTeamBadge;
            localStorage.setItem('badges_v2', JSON.stringify(cache));
        }
    } catch (e) {
        console.log('API gagal, pakai inisial keren untuk:', name);
    }
    checkVS(imgEl.closest('.match-header'));
}

function checkVS(container) {
    const h = container.querySelector('.img-h').style.display === 'block';
    const a = container.querySelector('.img-a').style.display === 'block';
    container.querySelector('.vs-badge').style.display = (h && a) ? 'block' : 'none';

const LGS={},LGM={},seen=new Set(),touched=new Set();
const DIV={E0:'Premier League',E1:'Championship',E2:'League One',E3:'League Two',SC0:'Scottish Premiership',D1:'Bundesliga',D2:'2. Bundesliga',I1:'Serie A',I2:'Serie B',SP1:'La Liga',SP2:'La Liga 2',F1:'Ligue 1',F2:'Ligue 2',N1:'Eredivisie',B1:'Belgian Pro League',P1:'Primeira Liga',T1:'Super Lig',G1:'Super League Greece',UCL:'UEFA Champions League'};
const tauF=(x,y,l,m,r)=>x==0&&y==0?1-l*m*r:x==0&&y==1?1+l*r:x==1&&y==0?1+m*r:x==1&&y==1?1-r:1;
const teams=c=>{const L=LGS[c.querySelector('.lg').value];return L?L.T:null};
function fillSel(c){
  const T=teams(c);c.querySelector('.ts').hidden=!T;if(!T)return;
  const o='<option value="">- pilih tim -</option>'+Object.keys(T).sort().map(n=>`<option>${esc(n)}</option>`).join('');
  c.querySelectorAll('.th,.ta').forEach(s=>{const v=s.value;s.innerHTML=o;s.value=v});
}
function fillLg(c){
  const ks=Object.keys(LGS),s=c.querySelector('.lg'),v=s.value;
  c.querySelector('.lgw').hidden=!ks.length;
  s.innerHTML='<option value="">- manual -</option>'+ks.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');
  s.value=LGS[v]?v:(ks.length==1?ks[0]:'');
  fillSel(c);
}
function wireSel(c){
  const lg=c.querySelector('.lg'),th=c.querySelector('.th'),ta=c.querySelector('.ta');
  const imgH=c.querySelector('.img-h'), nameH=c.querySelector('.name-h');
  const imgA=c.querySelector('.img-a'), nameA=c.querySelector('.name-a');
  const vs=c.querySelector('.vs-badge');
  
  const set=(k,v)=>{c.querySelector('[data-k='+k+']').value=v.toFixed(2)};
  const nm=()=>{if(th.value&&ta.value)c.querySelector('[data-k=nm]').value=th.value+' vs '+ta.value};
  
  lg.onchange=()=>{c.querySelectorAll('.th,.ta').forEach(s=>{s.innerHTML=''});fillSel(c);upd(c)};
  
  th.onchange=()=>{
    const T=teams(c),t=T&&T[th.value];
    if(t&&t.hn){set('hs',t.hs/t.hn);set('hc',t.hc/t.hn)}
    nm(); 
    getBadge(th.value, imgH, nameH, vs); 
    upd(c);
  };
  
  ta.onchange=()=>{
    const T=teams(c),t=T&&T[ta.value];
    if(t&&t.an){set('as',t.as/t.an);set('ac',t.ac/t.an)}
    nm(); 
    getBadge(ta.value, imgA, nameA, vs); 
    upd(c);
  };
  
  fillLg(c);
}
function ingest(txt,fb){
  try{
    const ln=txt.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
    const d=ln[0].includes(',')?',':';';
    const HD=ln[0].split(d).map(s=>s.trim());
    const ix=(...n)=>HD.findIndex(h=>n.includes(h));
    const ih=ix('HomeTeam','Home'),ia=ix('AwayTeam','Away'),ig=ix('FTHG','HG'),iv=ix('FTAG','AG'),id=ix('Div');
    if([ih,ia,ig,iv].some(i=>i<0))return[esc(fb)+': kolom tidak valid.'];
    let n=0;
    ln.slice(1).forEach(l=>{const f=l.split(d),hg=parseInt(f[ig]),ag=parseInt(f[iv]),h=(f[ih]||'').trim(),a=(f[ia]||'').trim();
      if(!(h&&a&&hg>=0&&ag>=0))return;
      const dv=id>=0?(f[id]||'').trim():'',nm=dv?(DIV[dv]||dv):fb;
      (LGM[nm]=LGM[nm]||[]).push({h,a,hg,ag});touched.add(nm);n++});
    return n?[]:[esc(fb)+': tidak ada baris valid.'];
  }catch(e){return[esc(fb)+': gagal ('+esc(String(e.message))+').']}
}
function estimate(nm){
  const M=LGM[nm],en=esc(nm);
  if(M.length<100 && nm!=='UCL'){delete LGS[nm];return en+': hanya '+M.length+' laga (min 100).'}
  if(M.length<10 && nm==='UCL'){delete LGS[nm];return en+': hanya '+M.length+' laga (min 10).'} // Toleransi UCL karena laga lebih sedikit
  
  const T={},mk=()=>({hs:0,hc:0,hn:0,as:0,ac:0,an:0});let sh=0,sa=0;
  M.forEach(m=>{const H=T[m.h]=T[m.h]||mk(),A=T[m.a]=T[m.a]||mk();
    H.hs+=m.hg;H.hc+=m.ag;H.hn++;A.as+=m.ag;A.ac+=m.hg;A.an++;sh+=m.hg;sa+=m.ag});
  const N=M.length,LH=sh/N,LA=sa/N,K=3;
  const av=(sum,n,L)=>(sum+K*L)/(n+K); 
  const R=[]; 
  M.forEach(m=>{const H=T[m.h],A=T[m.a];if(H.hn<2||A.an<2)return; // Toleransi UCL
    const n1=H.hn-1,n2=A.an-1;
    const lh=av(H.hs-m.hg,n1,LH)*av(A.ac-m.hg,n2,LH)/LH;
    const la=av(A.as-m.ag,n2,LA)*av(H.hc-m.ag,n1,LA)/LA;
    R.push({hg:m.hg,ag:m.ag,lh,la})});
  if(R.length<10 && nm==='UCL'){delete LGS[nm];return en+': riwayat kurang.'}
  if(R.length<100 && nm!=='UCL'){delete LGS[nm];return en+': riwayat kurang.'}
  
  const ll=r=>{let s=0;for(const m of R){const t=tauF(m.hg,m.ag,m.lh,m.la,r);if(t<=0)return -Infinity;s+=Math.log(t)}return s};
  let best=0,bl=-Infinity;const g=[];
  for(let i=-80;i<=40;i++){const r=i*0.005,v=ll(r);g.push([r,v]);if(v>bl){bl=v;best=r}}
  const ci=g.filter(x=>x[1]>=bl-1.92).map(x=>x[0]);
  LGS[nm]={name:nm,LH,LA,rho:best,lo:ci[0],hi:ci[ci.length-1],N,T};
  return '';
}
function finish(out){
  touched.forEach(nm=>{const m=estimate(nm);if(m)out.push(m)});touched.clear();
  const ks=Object.keys(LGS),cs=document.querySelectorAll('.m');
  cs.forEach(fillLg);cs.forEach(upd);
  let h=out.map(x=>'<div class="bad small" style="border:1px solid var(--bad); padding:4px; margin-bottom:4px;">'+x+'</div>').join('');
  h+=ks.map(k=>{const L=LGS[k],z=L.lo>0||L.hi<0;
    return `<div class="kv"><span><b>${esc(k)}</b> (${L.N})</span><span>K/T ${L.LH.toFixed(2)}/${L.LA.toFixed(2)}</span></div>`}).join('');
  $('#csvr').innerHTML=h;$('#csvx').hidden=!ks.length;
}
async function loadFiles(fs){
  const out=[];
  for(const f of fs){
    const sg=f.name+'|'+f.size+'|'+f.lastModified;
    if(seen.has(sg)){out.push(esc(f.name)+': sudah dilewati.');continue}
    seen.add(sg);
    try{out.push(...ingest(await f.text(),f.name.replace(/\.[^.]*$/,'').replace(/\s*\(\d+\)\s*$/,'')))}
    catch(e){out.push(esc(f.name)+': gagal.')}
  }
  finish(out);
}
$('#csvf').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)loadFiles(fs)};
$('#csvb').onclick=()=>{const t=$('#csvt').value,sg='p|'+t.length+'|'+t.slice(0,200)+'|'+t.slice(-200);
  if(seen.has(sg))return finish(['Teks sudah diproses.']);
  seen.add(sg);finish(ingest(t,$('#csvn').value.trim()||'Tempel'))};
$('#csvx').onclick=()=>{for(const k in LGS)delete LGS[k];for(const k in LGM)delete LGM[k];seen.clear();finish([])};
$('#add').onclick=add;
$('#set').addEventListener('input',()=>{document.querySelectorAll('.m').forEach(upd);parlay()});
$('#adv').onchange=e=>document.body.classList.toggle('adv',e.target.checked);
add();add();
</script>

<script>
(function(){
  if (!location.hostname.includes('vercel.app') && !location.hostname.includes('netlify.app')) return;
  
  const LG_MAP = [
    ['E0','Premier League'], ['E1','Championship'],
    ['E2','League One'], ['E3','League Two'], ['EC','National League'],
    ['SC0','Scottish Premiership'], ['SC1','Scottish Championship'],
    ['D1','Bundesliga'], ['D2','2. Bundesliga'],
    ['I1','Serie A'], ['I2','Serie B'],
    ['SP1','La Liga'], ['SP2','La Liga 2'],
    ['F1','Ligue 1'], ['F2','Ligue 2'],
    ['N1','Eredivisie'], ['P1','Primeira Liga'],
    ['T1','Super Lig'], ['B1','Belgian Pro League'],
    ['G1','Super League Greece']
  ];
  const LOADED = new Set();
  let btn, status;
  function inject(){
    const card = document.querySelector('#set');
    if (!card || document.getElementById('auto-leagues')) return;
    
    // TOMBOL LIGA EROPA BIASA
    btn = document.createElement('button');
    btn.id = 'auto-leagues';
    btn.type = 'button';
    btn.textContent = '⚡ Muat liga Eropa';
    btn.style.cssText = 'width:100%;margin:8px 0;background:var(--ac);color:#000;border:2px solid var(--bd);font-weight:700;font-family:Oswald,sans-serif;text-transform:uppercase;padding:12px;box-shadow:4px 4px 0 var(--shadow);cursor:pointer';
    
    status = document.createElement('p');
    status.className = 'mut small';
    status.id = 'auto-status';
    status.style.cssText = 'margin-bottom:12px; font-weight:700; color:var(--ac);';
    status.textContent = 'Data dari football-data.co.uk';
    
    card.insertBefore(status, card.firstChild);
    card.insertBefore(btn, status);

    // TOMBOL UCL BARU
    const btnUcl = document.createElement('button');
    btnUcl.id = 'load-ucl';
    btnUcl.type = 'button';
    btnUcl.textContent = '🏆 Muat Liga Champions (UCL)';
    btnUcl.style.cssText = 'width:100%;margin:8px 0;background:var(--bad);color:#fff;border:2px solid var(--bd);font-weight:700;font-family:Oswald,sans-serif;text-transform:uppercase;padding:12px;box-shadow:4px 4px 0 var(--shadow);cursor:pointer';
    card.insertBefore(btnUcl, btn.nextSibling);

    btn.onclick = run;
    
    btnUcl.onclick = async () => {
      if (btnUcl.disabled) return;
      btnUcl.disabled = true;
      btnUcl.textContent = 'Mengambil data UCL...';
      btnUcl.style.transform = 'translate(4px,4px)';
      btnUcl.style.boxShadow = 'none';
      
      try {
        const r = await fetch('/api/fetch-ucl');
        if (!r.ok) {
          const err = await r.json();
          throw new Error(err.error || 'Gagal ambil data');
        }
        const csvText = await r.text();
        ingest(csvText, 'UCL'); 
        finish([]);
        btnUcl.textContent = '✓ UCL dimuat!';
        btnUcl.style.background = 'var(--ok)';
        btnUcl.style.color = '#000';
      } catch (e) {
        console.error(e);
        btnUcl.textContent = '✗ Gagal: ' + e.message;
        alert('Gagal memuat UCL: ' + e.message + '\n\nPastikan API key sudah benar.');
      } finally {
        btnUcl.disabled = false;
        btnUcl.style.transform = 'none';
        btnUcl.style.boxShadow = '4px 4px 0 var(--shadow)';
        setTimeout(() => { 
            btnUcl.textContent = '🏆 Muat Liga Champions (UCL)'; 
            btnUcl.style.background = 'var(--bad)';
            btnUcl.style.color = '#fff';
        }, 3000);
      }
    };
  }
  
  async function run(){
    if (btn.disabled) return;
    btn.disabled = true;
    btn.style.transform = 'translate(4px,4px)';
    btn.style.boxShadow = 'none';
    let ok=0, fail=0;
    for (let i=0; i<LG_MAP.length; i++){
      const [code, name] = LG_MAP[i];
      if ((name in LGS) || LOADED.has(code)) { ok++; continue; }
      btn.textContent = 'Memuat ' + name + '…';
      try {
        const r = await fetch('/api/fetch-csv?league=' + code);
        if (!r.ok) { fail++; continue; }
        const text = await r.text();
        if (!text || text.length < 200) { fail++; continue; }
        ingest(text, code);
        LOADED.add(code);
        ok++;
      } catch(e){ fail++; }
    }
    finish([]);
    btn.textContent = '✓ ' + ok + ' dimuat' + (fail ? ', ' + fail + ' gagal' : '');
    btn.disabled = false;
    btn.style.transform = 'none';
    btn.style.boxShadow = '4px 4px 0 var(--shadow)';
    status.textContent = ok + ' liga siap. Pilih liga di kartu pertandingan.';
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', inject);
  } else {
    inject();
  }
})();
</script>

<script>
(function() {
  const SAVE_KEY = 'parlay_autosave_v8';
  function saveState() {
    const globals = {};
    ['lh','la','rho','bk','kf','xw','kp','ha'].forEach(id => {
      const el = document.getElementById(id);
      if (el) globals[id] = el.value;
    });
    const cards = [];
    document.querySelectorAll('.m').forEach(c => {
      const cardData = { inputs: [] };
      c.querySelectorAll('input, select').forEach(el => {
        cardData.inputs.push({
          k: el.getAttribute('data-k'),
          cls: el.className,
          val: el.value,
          chk: el.checked
        });
      });
      cards.push(cardData);
    });
    localStorage.setItem(SAVE_KEY, JSON.stringify({ globals, cards }));
  }
  function loadState() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      if (data.globals) {
        Object.keys(data.globals).forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = data.globals[id];
        });
      }
      if (data.cards && data.cards.length > 0) {
        document.getElementById('list').innerHTML = ''; 
        data.cards.forEach(cardData => {
          add(); 
          const c = document.querySelector('.m:last-child');
          const lgEl = c.querySelector('.lg');
          const savedLg = cardData.inputs.find(i => i.cls && i.cls.includes('lg'));
          if (savedLg && lgEl) {
            lgEl.value = savedLg.val;
            if (lgEl.onchange) lgEl.onchange();
          }
          const thEl = c.querySelector('.th');
          const taEl = c.querySelector('.ta');
          const savedTh = cardData.inputs.find(i => i.cls && i.cls.includes('th'));
          const savedTa = cardData.inputs.find(i => i.cls && i.cls.includes('ta'));
          if (savedTh && thEl) thEl.value = savedTh.val;
          if (savedTa && taEl) taEl.value = savedTa.val;
          
          cardData.inputs.forEach(inp => {
            if (inp.k) {
              const el = c.querySelector(`[data-k="${inp.k}"]`);
              if (el) {
                el.value = inp.val;
                el.checked = inp.chk;
              }
            }
          });
          if (thEl.value) c.querySelector('.th').onchange();
          if (taEl.value) c.querySelector('.ta').onchange();
          
          upd(c);
        });
      }
    } catch(e) { console.error('Gagal memuat', e); }
  }
  document.body.addEventListener('input', saveState);
  document.body.addEventListener('change', saveState);
  setTimeout(() => { loadState(); parlay(); }, 100);
})();
</script>

</body></html>
